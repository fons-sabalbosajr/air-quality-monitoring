<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/emblogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Runtime API base fallback (set via VITE_API_BASE at build time or edit here post-build) -->
    <meta name="api-base" content="" />
  <title>EMBR3 Air Quality Monitoring (2026)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      Lightweight ES5 NLEX / VNNOX LED-wall fallback.
      This runs even on signage browsers that cannot execute the modern ES-module
      bundle, so the LED wall always shows the current UI. It owns the page for the
      plain /nlex and /nlex?fallback=1 URLs. The richer React display is only loaded
      for the explicit browser preview (?mode=browser or /nlex-preview), in which
      case this script bails out and lets the module take over.
    -->
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, "");
        var isNlex = path === "/nlex" || path === "/air-quality-monitoring/nlex";
        if (!isNlex) return;

        function queryParam(name) {
          var search = window.location.search || "";
          var match = search.match(new RegExp("[?&]" + name + "=([^&]*)"));
          return match ? decodeURIComponent(match[1].replace(/\+/g, " ")) : "";
        }

        // Explicit browser preview → let the React bundle render the rich display.
        var previewMode = queryParam("mode") || queryParam("preview");
        if (/^(browser|full|test|1|true)$/i.test(previewMode)) return;

        var root = document.getElementById("root");
        if (!root) return;

        var basePath =
          window.location.pathname.indexOf("/air-quality-monitoring/") === 0
            ? "/air-quality-monitoring"
            : "";
        var apiRoots = [basePath + "/api"];
        if (window.location.hostname !== "embr3-onlinesystems.cloud") {
          apiRoots.push(
            "https://embr3-onlinesystems.cloud/air-quality-monitoring/api"
          );
        }
        var embLogoSrc = basePath + "/emblogo.svg";
        var bpLogoSrc = basePath + "/bplogo.svg";

        /* ── Stations: one card per station + pollutant ── */
        var stations = [
          { station: "Clark", parameter: "PM10", province: "clark", pollutant: "pm10", stationKey: "clark", pollutantKey: "clark_pm10" },
          { station: "San Fernando", parameter: "PM10", province: "san-fernando", pollutant: "pm10", stationKey: "san-fernando", pollutantKey: "san-fernando_pm10" },
          { station: "Meycauayan", parameter: "PM10", province: "meycauayan", pollutant: "pm10", stationKey: "meycauayan", pollutantKey: "meycauayan_pm10" },
          { station: "Meycauayan", parameter: "PM2.5", province: "meycauayan", pollutant: "pm25", stationKey: "meycauayan", pollutantKey: "meycauayan_pm25" },
          { station: "Zambales", parameter: "PM10", province: "zambales", pollutant: "pm10", stationKey: "zambales", pollutantKey: "zambales_pm10" },
          { station: "Zambales", parameter: "PM2.5", province: "zambales", pollutant: "pm25", stationKey: "zambales", pollutantKey: "zambales_pm25" }
        ];

        var bands = [
          { name: "Good", color: "#52c41a", text: "#fff", min: 0, max: 50, emoji: "\uD83D\uDE0A" },
          { name: "Fair", color: "#d4b106", text: "#1a2340", min: 51, max: 100, emoji: "\uD83D\uDE10" },
          { name: "Unhealthy for Sensitive Groups", color: "#fa8c16", text: "#fff", min: 101, max: 150, emoji: "\uD83D\uDE37" },
          { name: "Very Unhealthy", color: "#f5222d", text: "#fff", min: 151, max: 200, emoji: "\uD83D\uDE30" },
          { name: "Acutely Unhealthy", color: "#722ed1", text: "#fff", min: 201, max: 300, emoji: "\uD83D\uDE31" },
          { name: "Emergency", color: "#a8071a", text: "#fff", min: 301, max: 500, emoji: "\u2620\uFE0F" }
        ];

        var defaultSettings = {
          stationsVisible: { clark: true, "san-fernando": true, meycauayan: true, zambales: true },
          pollutantsVisible: {
            clark_pm10: true,
            "san-fernando_pm10": true,
            meycauayan_pm10: true,
            meycauayan_pm25: true,
            zambales_pm10: true,
            zambales_pm25: true
          },
          theme: "light",
          showHeader: true,
          showAqiLegend: true,
          showFooter: true,
          showDateTime: true
        };

        var state = {}; // province:pollutant -> { row, time, displayTime, fetchedAt }
        var currentSettings = defaultSettings;
        var bundleStorageKey = "aqm_nlex_lw_bundle";

        function extend(target, source) {
          var key;
          for (key in source) {
            if (Object.prototype.hasOwnProperty.call(source, key)) target[key] = source[key];
          }
          return target;
        }

        function mergeSettings(source) {
          var s = source && typeof source === "object" ? source : {};
          var merged = extend({}, defaultSettings);
          extend(merged, s);
          merged.stationsVisible = extend(
            extend({}, defaultSettings.stationsVisible),
            s.stationsVisible || {}
          );
          merged.pollutantsVisible = extend(
            extend({}, defaultSettings.pollutantsVisible),
            s.pollutantsVisible || {}
          );
          return merged;
        }

        function escapeHtml(value) {
          return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
          });
        }

        function getBand(value) {
          var n = Number(value);
          if (!isFinite(n)) return null;
          if (n <= 50) return bands[0];
          if (n <= 100) return bands[1];
          if (n <= 150) return bands[2];
          if (n <= 200) return bands[3];
          if (n <= 300) return bands[4];
          return bands[5];
        }

        function isVisible(item) {
          var sv = currentSettings.stationsVisible || defaultSettings.stationsVisible;
          var pv = currentSettings.pollutantsVisible || defaultSettings.pollutantsVisible;
          return sv[item.stationKey] !== false && pv[item.pollutantKey] !== false;
        }

        function pad2(n) {
          return n < 10 ? "0" + n : "" + n;
        }

        function formatClockDate(d) {
          if (!d || isNaN(d.getTime())) return "";
          var h = d.getHours();
          var ampm = h >= 12 ? "PM" : "AM";
          h = h % 12 || 12;
          return (
            pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()) + "/" + d.getFullYear() +
            " " + h + ":" + pad2(d.getMinutes()) + " " + ampm
          );
        }

        function parseDisplayTime(value) {
          if (!value) return null;
          var raw = String(value).replace(/^\s+|\s+$/g, "");
          var m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);
          var d;
          var h;
          if (m) {
            h = Number(m[4]);
            if (/PM/i.test(m[7] || "") && h < 12) h += 12;
            if (/AM/i.test(m[7] || "") && h === 12) h = 0;
            d = new Date(Number(m[3]), Number(m[1]) - 1, Number(m[2]), h, Number(m[5]), Number(m[6] || 0));
            return isNaN(d.getTime()) ? null : d;
          }
          d = new Date(raw);
          return isNaN(d.getTime()) ? null : d;
        }

        function formatTime(item) {
          var d;
          if (!item) return "";
          if (item.time) {
            d = new Date(item.time);
            if (!isNaN(d.getTime())) return formatClockDate(d);
          }
          d = parseDisplayTime(item.displayTime);
          if (d) return formatClockDate(d);
          if (item.fetchedAt) {
            d = new Date(item.fetchedAt);
            if (!isNaN(d.getTime())) return formatClockDate(d);
          }
          return "";
        }

        /* ── Persistence (best-effort; signage browsers may block storage) ── */
        function clearLegacyStorage() {
          try { localStorage.removeItem(bundleStorageKey); } catch (err) {}
          try { localStorage.removeItem("nlex-settings"); } catch (err) {}
        }

        function readStoredBundle() {
          return null;
        }

        function writeStoredBundle(data) {
          void data;
        }

        function readStoredSettings() {
          return defaultSettings;
        }

        /* ── Render the static shell once ── */
        function renderShell() {
          root.innerHTML = [
            "<style>",
              "html,body,#root{width:100%;height:100%;margin:0;background:#f4f7fb;overflow:hidden}",
              ".nf-root{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7fb;color:#152033;font-family:Arial,Helvetica,sans-serif}",
              ".nf-wall{width:min(100vw,62.5vh);height:min(100vh,160vw);max-width:960px;max-height:1536px;background:#fff;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;border-radius:14px}",
              ".nf-head{display:flex;align-items:center;gap:18px;padding-bottom:14px;border-bottom:2px solid #d5deea}",
              ".nf-logos{display:flex;align-items:center;gap:10px;flex:0 0 auto}",
              ".nf-logo{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:50%;padding:5px;box-sizing:border-box}",
              ".nf-logo-bp{background:transparent;border-radius:0;padding:0}",
              ".nf-agency{font-size:28px;font-weight:800;line-height:1.08;text-transform:uppercase}",
              ".nf-region{font-size:18px;font-weight:700;color:#486176;margin-top:4px;text-transform:uppercase}",
              ".nf-title{text-align:center;font-size:36px;font-weight:900;line-height:1.05;text-transform:uppercase}",
              ".nf-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}",
              ".nf-card{min-width:0;min-height:0;background:#f8fbff;border:4px solid #94a3b8;border-radius:18px;padding:14px 12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}",
              ".nf-station{font-size:29px;font-weight:900;line-height:1.08;text-transform:uppercase;color:#142033}",
              ".nf-param{font-size:27px;font-weight:900;line-height:1.05;text-transform:uppercase;color:#255174;margin-top:8px}",
              ".nf-aqi{font-size:116px;font-weight:900;line-height:.9;font-variant-numeric:tabular-nums;margin:12px 0 10px}",
              ".nf-status{width:100%;box-sizing:border-box;border-radius:12px;padding:12px 10px;font-size:28px;font-weight:900;line-height:1.08;text-transform:uppercase}",
              ".nf-time{font-size:21px;font-weight:800;color:#486176;line-height:1.25;text-transform:uppercase;margin-top:12px}",
              ".nf-legend{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}",
              ".nf-band{padding:10px 4px;text-align:center;font-size:15px;font-weight:900;line-height:1.08;text-transform:uppercase;border-radius:10px}",
              ".nf-empty{display:flex;align-items:center;justify-content:center;text-align:center;font-size:32px;font-weight:900;color:#486176;text-transform:uppercase}",
              ".nf-foot{display:flex;justify-content:space-between;gap:14px;color:#255174;font-size:19px;font-weight:700;border-top:2px solid #d5deea;padding-top:12px}",
              ".nf-contact{display:flex;align-items:center;gap:12px;min-width:0;white-space:nowrap}",
              ".nf-icon{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 4px;border-radius:7px;background:#e8eff8;color:#255174;font-size:14px;font-weight:900;line-height:1;margin-right:5px;box-sizing:border-box}",
              ".nf-fb{font-family:Arial,Helvetica,sans-serif;font-size:17px}",
              ".nf-sep{color:#94a3b8}",
              ".nf-hidden{display:none!important}",
              ".nf-dark{background:#07111f;color:#f8fafc}",
              ".nf-dark .nf-wall{background:#0b1526}",
              ".nf-dark .nf-head{border-bottom-color:#334155}",
              ".nf-dark .nf-region,.nf-dark .nf-time{color:#cbd5e1}",
              ".nf-dark .nf-card{background:#101c30;border-color:#334155}",
              ".nf-dark .nf-station{color:#f8fafc}",
              ".nf-dark .nf-param{color:#dbeafe}",
              ".nf-dark .nf-foot{color:#dbeafe;border-top-color:#334155}",
            "</style>",
            '<div class="nf-root" id="nf-root">',
              '<main class="nf-wall">',
                '<header class="nf-head" id="nf-head">',
                  '<div class="nf-logos">',
                    '<img class="nf-logo nf-logo-bp" src="', bpLogoSrc, '" alt="Bagong Pilipinas">',
                    '<img class="nf-logo" src="', embLogoSrc, '" alt="EMB">',
                  "</div>",
                  "<div>",
                    '<div class="nf-agency">Environmental Management Bureau</div>',
                    '<div class="nf-region">Region III - Central Luzon</div>',
                  "</div>",
                "</header>",
                '<div class="nf-title" id="nf-title">Air Quality Monitoring</div>',
                '<section class="nf-grid" id="nf-grid"></section>',
                '<section class="nf-legend" id="nf-legend"></section>',
                '<footer class="nf-foot" id="nf-foot">',
                  '<span class="nf-contact"><span><span class="nf-icon">WEB</span>r3.emb.gov.ph</span><span class="nf-sep">|</span><span><span class="nf-icon nf-fb">f</span>facebook.com/EMBRegion3</span></span>',
                  '<span id="nf-clock"></span>',
                "</footer>",
              "</main>",
            "</div>"
          ].join("");
        }

        function renderCards() {
          var grid = document.getElementById("nf-grid");
          if (!grid) return;
          var visible = [];
          var i;
          for (i = 0; i < stations.length; i += 1) {
            if (isVisible(stations[i])) visible.push(stations[i]);
          }
          grid.style.gridTemplateColumns = visible.length <= 2 ? "1fr" : "1fr 1fr";
          if (!visible.length) {
            grid.innerHTML = '<div class="nf-empty">No AQI cards selected</div>';
            return;
          }
          var html = "";
          for (i = 0; i < visible.length; i += 1) {
            var card = visible[i];
            var item = state[card.province + ":" + card.pollutant];
            var aqi = item && item.row ? Number(item.row.AQI == null ? item.row.aqi : item.row.AQI) : NaN;
            var band = getBand(aqi);
            var color = band ? band.color : "#475569";
            var textColor = band ? band.text : "#fff";
            var label = band ? band.emoji + " " + band.name : "Updating";
            var time = formatTime(item);
            html +=
              '<article class="nf-card" style="border-color:' + color + '">' +
                '<div class="nf-station">' + escapeHtml(card.station) + " AQI</div>" +
                '<div class="nf-param">' + escapeHtml(card.parameter) + "</div>" +
                '<div class="nf-aqi" style="color:' + color + '">' + (isFinite(aqi) ? Math.round(aqi) : "--") + "</div>" +
                '<div class="nf-status" style="background:' + color + ";color:" + textColor + '">' + label + "</div>" +
                '<div class="nf-time">' + (time ? '<span class="nf-icon">\uD83D\uDD53</span>As of ' + escapeHtml(time) : "Loading latest data") + "</div>" +
              "</article>";
          }
          grid.innerHTML = html;
        }

        function renderLegend() {
          var legend = document.getElementById("nf-legend");
          if (!legend) return;
          var html = "";
          var i;
          for (i = 0; i < bands.length; i += 1) {
            html +=
              '<div class="nf-band" style="background:' + bands[i].color + ";color:" + bands[i].text + '">' +
              bands[i].emoji + " " + bands[i].name + "<br>" + bands[i].min + "-" + bands[i].max +
              "</div>";
          }
          legend.innerHTML = html;
        }

        function tickClock() {
          var clock = document.getElementById("nf-clock");
          if (!clock) return;
          var now = new Date();
          var h = now.getHours();
          var ampm = h >= 12 ? "PM" : "AM";
          h = h % 12 || 12;
          clock.innerHTML = '<span class="nf-icon">\uD83D\uDD53</span>' + h + ":" + pad2(now.getMinutes()) + " " + ampm;
        }

        function applySettings(settings) {
          if (settings) currentSettings = mergeSettings(settings);
          var nativeRoot = document.getElementById("nf-root");
          var head = document.getElementById("nf-head");
          var title = document.getElementById("nf-title");
          var legend = document.getElementById("nf-legend");
          var foot = document.getElementById("nf-foot");
          var clock = document.getElementById("nf-clock");
          if (nativeRoot) nativeRoot.className = "nf-root" + (currentSettings.theme === "dark" ? " nf-dark" : "");
          if (head) head.className = "nf-head" + (currentSettings.showHeader === false ? " nf-hidden" : "");
          if (title) title.className = "nf-title" + (currentSettings.showHeader === false ? " nf-hidden" : "");
          if (legend) legend.className = "nf-legend" + (currentSettings.showAqiLegend === false ? " nf-hidden" : "");
          if (foot) foot.className = "nf-foot" + (currentSettings.showFooter === false ? " nf-hidden" : "");
          if (clock) clock.className = currentSettings.showDateTime === false ? "nf-hidden" : "";
          renderCards();
        }

        /* ── JSONP helpers (script-tag loading dodges CORS on signage players) ── */
        function loadJsonp(id, callbackName, urlBase, onError) {
          var old = document.getElementById(id);
          if (old && old.parentNode) old.parentNode.removeChild(old);
          var script = document.createElement("script");
          var sep = urlBase.indexOf("?") === -1 ? "?" : "&";
          script.id = id;
          script.async = true;
          script.src = urlBase + sep + "callback=" + callbackName + "&t=" + Date.now();
          script.onerror = function () {
            if (script.parentNode) script.parentNode.removeChild(script);
            if (onError) onError();
          };
          (document.head || document.getElementsByTagName("head")[0]).appendChild(script);
        }

        window.__aqmLwData = function (payload) {
          if (payload && payload.data) {
            var key;
            for (key in payload.data) {
              if (Object.prototype.hasOwnProperty.call(payload.data, key) && payload.data[key]) {
                state[key] = payload.data[key];
              }
            }
            writeStoredBundle(payload.data);
          }
          renderCards();
        };

        window.__aqmLwCfg = function (payload) {
          if (payload && payload.persisted && payload.settings) {
            applySettings(payload.settings);
          }
        };

        function loadDataFrom(index) {
          if (index >= apiRoots.length) {
            loadDataXhr();
            return;
          }
          loadJsonp("aqm-lw-data", "__aqmLwData", apiRoots[index] + "/nlex-latest.js", function () {
            loadDataFrom(index + 1);
          });
        }

        function loadData() {
          loadDataFrom(0);
        }

        function loadSettingsFrom(index) {
          if (index >= apiRoots.length) return;
          loadJsonp("aqm-lw-cfg", "__aqmLwCfg", apiRoots[index] + "/nlex-settings.js", function () {
            loadSettingsFrom(index + 1);
          });
        }

        function loadSettings() {
          loadSettingsFrom(0);
        }

        /* ── XHR fallback (used only if every JSONP root fails) ── */
        function xhrJson(url, done) {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.timeout = 15000;
          try {
            xhr.setRequestHeader("Accept", "application/json");
            xhr.setRequestHeader("Cache-Control", "no-cache");
          } catch (err) {
            /* some players disallow setting headers */
          }
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                done(null, JSON.parse(xhr.responseText));
              } catch (e) {
                done(e);
              }
            } else {
              done(new Error("HTTP " + xhr.status));
            }
          };
          xhr.onerror = function () {
            done(new Error("network"));
          };
          xhr.ontimeout = function () {
            done(new Error("timeout"));
          };
          xhr.send();
        }

        function latestUrl(apiRoot, item) {
          return (
            apiRoot + "/tabular/" + encodeURIComponent(item.province) + "/" +
            encodeURIComponent(item.pollutant) + "/latest?vnnox=" + Date.now()
          );
        }

        function loadLatest(item, done) {
          var index = 0;
          function tryNext() {
            if (index >= apiRoots.length) {
              done(new Error("all endpoints failed"));
              return;
            }
            xhrJson(latestUrl(apiRoots[index], item), function (err, json) {
              if (!err && json && json.row) {
                done(null, json);
                return;
              }
              index += 1;
              tryNext();
            });
          }
          tryNext();
        }

        function loadDataXhr() {
          var pending = 0;
          function doneFor(key) {
            return function (err, json) {
              if (!err && json) {
                state[key] = json;
                writeStoredBundle(state);
              }
              pending -= 1;
              if (pending <= 0) renderCards();
            };
          }
          var i;
          for (i = 0; i < stations.length; i += 1) {
            pending += 1;
            loadLatest(
              { province: stations[i].province, pollutant: stations[i].pollutant },
              doneFor(stations[i].province + ":" + stations[i].pollutant)
            );
          }
          if (!pending) renderCards();
        }

        /* ── Boot ── */
        var storedBundle = readStoredBundle();
        if (storedBundle) state = storedBundle;
        clearLegacyStorage();
        currentSettings = readStoredSettings();

        renderShell();
        applySettings(null);
        renderCards();
        renderLegend();
        tickClock();
        loadSettings();
        loadData();

        setInterval(tickClock, 30000);
        setInterval(loadData, 30000);
        setInterval(loadSettings, 15000);
      })();
    </script>
  </body>
</html>
