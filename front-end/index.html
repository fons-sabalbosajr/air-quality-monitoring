<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/emblogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Runtime API base fallback (set via VITE_API_BASE at build time or edit here post-build) -->
    <meta name="api-base" content="" />
  <title>EMBR3 Air Quality Monitoring (2026)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, "");
        var isNlex = path === "/nlex" || path === "/air-quality-monitoring/nlex";
        if (!isNlex) return;

        var root = document.getElementById("root");
        if (!root) return;

        var stations = [
          {
            key: "clark",
            name: "Clark Air Quality Index",
            address: "Clark Freeport Zone, Pampanga",
            pollutants: [{ province: "clark", pollutant: "pm10", label: "PM10" }]
          },
          {
            key: "san-fernando",
            name: "San Fernando Air Quality Index",
            address: "San Fernando, Pampanga",
            pollutants: [{ province: "san-fernando", pollutant: "pm10", label: "PM10" }]
          },
          {
            key: "meycauayan",
            name: "Meycauayan Air Quality Index",
            address: "Meycauayan, Bulacan",
            pollutants: [
              { province: "meycauayan", pollutant: "pm10", label: "PM10" },
              { province: "meycauayan", pollutant: "pm25", label: "PM2.5" }
            ]
          },
          {
            key: "zambales",
            name: "Zambales Air Quality Index",
            address: "Santa Cruz, Zambales",
            pollutants: [
              { province: "zambales", pollutant: "pm10", label: "PM10" },
              { province: "zambales", pollutant: "pm25", label: "PM2.5" }
            ]
          }
        ];

        var bands = [
          { id: "good", name: "GOOD", short: "Good", min: 0, max: 51, color: "#3AAE49", fg: "#ffffff", text: "Air is clean. Safe for everyone." },
          { id: "fair", name: "FAIR", short: "Fair", min: 51, max: 101, color: "#FFDE59", fg: "#1a2340", text: "Acceptable. Sensitive groups take caution." },
          { id: "usg", name: "UNHEALTHY FOR SENSITIVE GROUPS", short: "Sensitive", min: 101, max: 151, color: "#FF904E", fg: "#ffffff", text: "Children, elderly and sick people should limit outdoor activity." },
          { id: "vu", name: "VERY UNHEALTHY", short: "Very Unhealthy", min: 151, max: 201, color: "#FF3131", fg: "#ffffff", text: "Wear a mask. Everyone may feel health effects." },
          { id: "au", name: "ACUTELY UNHEALTHY", short: "Acutely Unhealthy", min: 201, max: 301, color: "#9E70F4", fg: "#ffffff", text: "Health hazard for all. Avoid outdoor exposure." },
          { id: "emergency", name: "EMERGENCY", short: "Emergency", min: 301, max: 501, color: "#730000", fg: "#ffffff", text: "Stay indoors. Air is dangerous for everyone." }
        ];

        var state = {};
        var basePath = window.location.pathname.indexOf("/air-quality-monitoring/") === 0
          ? "/air-quality-monitoring"
          : "";
        var apiRoots = [basePath + "/api"];
        if (window.location.hostname !== "embr3-onlinesystems.cloud") {
          apiRoots.push("https://embr3-onlinesystems.cloud/air-quality-monitoring/api");
        }

        function escapeHtml(value) {
          return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
          });
        }

        function getBand(aqi) {
          var n = Number(aqi);
          var i;
          if (!isFinite(n) || n < 0) return bands[0];
          for (i = 0; i < bands.length; i += 1) {
            if (n >= bands[i].min && n < bands[i].max) return bands[i];
          }
          return bands[bands.length - 1];
        }

        function parseDate(value) {
          var d;
          var m;
          var hour;
          if (!value) return null;
          if (typeof value === "number") {
            d = new Date(value);
            return isNaN(d.getTime()) ? null : d;
          }
          m = String(value).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);
          if (m) {
            hour = Number(m[4]);
            if (/PM/i.test(m[7] || "") && hour < 12) hour += 12;
            if (/AM/i.test(m[7] || "") && hour === 12) hour = 0;
            return new Date(Number(m[3]), Number(m[1]) - 1, Number(m[2]), hour, Number(m[5]), Number(m[6] || 0));
          }
          d = new Date(value);
          return isNaN(d.getTime()) ? null : d;
        }

        function fmtDate(msOrString) {
          var d = parseDate(msOrString);
          if (!d || isNaN(d.getTime())) return "Updating";
          return d.toLocaleString("en-PH", {
            month: "short",
            day: "2-digit",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          });
        }

        function xhrJson(url, done) {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.timeout = 15000;
          xhr.setRequestHeader("Accept", "application/json");
          xhr.setRequestHeader("Cache-Control", "no-cache");
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            if (xhr.status >= 200 && xhr.status < 300) {
              try { done(null, JSON.parse(xhr.responseText)); }
              catch (err) { done(err); }
            } else {
              done(new Error("HTTP " + xhr.status));
            }
          };
          xhr.onerror = function () { done(new Error("network")); };
          xhr.ontimeout = function () { done(new Error("timeout")); };
          xhr.send();
        }

        function latestUrl(apiRoot, item) {
          return apiRoot + "/tabular/" + encodeURIComponent(item.province) + "/" + encodeURIComponent(item.pollutant) + "/latest?vnnox=" + Date.now();
        }

        function loadLatest(item, done) {
          var index = 0;
          function tryNext() {
            if (index >= apiRoots.length) {
              done(new Error("all endpoints failed"));
              return;
            }
            xhrJson(latestUrl(apiRoots[index], item), function (err, json) {
              if (!err && json && json.row) {
                done(null, json);
                return;
              }
              index += 1;
              tryNext();
            });
          }
          tryNext();
        }

        function loadJsonpBundle(done) {
          var index = 0;
          function tryNext() {
            var callbackName;
            var script;
            var finished = false;
            var timeoutId;
            if (index >= apiRoots.length) {
              done(false);
              return;
            }
            callbackName = "__aqmNlexLatest_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
            function cleanup() {
              try { delete window[callbackName]; } catch (err) { window[callbackName] = null; }
              if (script && script.parentNode) script.parentNode.removeChild(script);
              if (timeoutId) clearTimeout(timeoutId);
            }
            window[callbackName] = function (payload) {
              var key;
              if (finished) return;
              finished = true;
              if (payload && payload.data) {
                for (key in payload.data) {
                  if (Object.prototype.hasOwnProperty.call(payload.data, key) && payload.data[key] && payload.data[key].row) {
                    state[key] = payload.data[key];
                  }
                }
              }
              cleanup();
              done(true);
            };
            script = document.createElement("script");
            script.async = true;
            script.src = apiRoots[index] + "/nlex-latest.js?callback=" + encodeURIComponent(callbackName) + "&vnnox=" + Date.now();
            script.onerror = function () {
              if (finished) return;
              finished = true;
              cleanup();
              index += 1;
              tryNext();
            };
            timeoutId = setTimeout(function () {
              if (finished) return;
              finished = true;
              cleanup();
              index += 1;
              tryNext();
            }, 8000);
            document.getElementsByTagName("head")[0].appendChild(script);
          }
          tryNext();
        }

        function pollutantHtml(item) {
          var key = item.province + ":" + item.pollutant;
          var data = state[key] || {};
          var row = data.row || {};
          var aqi = Number(row.AQI || row.aqi);
          var hasAqi = isFinite(aqi) && aqi > 0;
          var band = getBand(hasAqi ? aqi : 0);
          var status = hasAqi ? (row.Status || row.status || band.short) : "Updating";
          var time = data.displayTime || data.time || row[data.dateKey || "Date & Time"];
          var percent = hasAqi ? Math.max(0, Math.min(100, (aqi / 500) * 100)) : 0;
          return [
            '<div class="vn-pollutant" style="border-color:', hasAqi ? band.color : '#d8dee9', '">',
              '<div class="vn-pollutant-meta">',
                '<span class="vn-param">', escapeHtml(item.label), '</span>',
                '<span class="vn-status" style="background:', band.color, ';color:', band.fg, '">', escapeHtml(status), '</span>',
              '</div>',
              '<div class="vn-aqi-row"><div class="vn-aqi" style="color:', band.color, '">', hasAqi ? Math.round(aqi) : "--", '</div></div>',
              '<div class="vn-meter"><span style="width:', percent, '%;background:', band.color, '"></span></div>',
              '<div class="vn-desc">', hasAqi ? escapeHtml(band.text) : "Waiting for live AQI data from server.", '</div>',
              '<div class="vn-asof">As of ', escapeHtml(fmtDate(time)), '</div>',
            '</div>'
          ].join("");
        }

        function render() {
          var now = new Date();
          root.innerHTML = [
            '<style>',
              'html,body,#root{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#14213d}',
              '.vn-wall{width:100vw;height:100vh;box-sizing:border-box;padding:34px;background:#f5f7fb;display:flex;flex-direction:column;gap:18px}',
              '.vn-header{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:96px;border-bottom:5px solid #14213d;padding-bottom:18px}',
              '.vn-brand{display:flex;align-items:center;gap:18px;min-width:0}',
              '.vn-logo{width:84px;height:84px;object-fit:contain;flex:0 0 auto}',
              '.vn-kicker{font-size:20px;font-weight:800;color:#3AAE49;text-transform:uppercase}',
              '.vn-title{font-size:48px;font-weight:900;line-height:1;white-space:nowrap}',
              '.vn-clock{font-size:24px;font-weight:900;text-align:right;color:#475569;min-width:260px}',
              '.vn-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}',
              '.vn-card{background:#ffffff;border:2px solid #d8dee9;border-radius:8px;padding:18px;display:flex;flex-direction:column;min-height:0;box-shadow:0 8px 22px rgba(20,33,61,.08)}',
              '.vn-card-title{font-size:30px;font-weight:900;line-height:1.05}',
              '.vn-address{font-size:18px;font-weight:800;color:#64748b;margin-top:4px;margin-bottom:12px}',
              '.vn-card-body{display:grid;grid-template-columns:1fr;gap:12px;flex:1;min-height:0}',
              '.vn-card-body.dual{grid-template-columns:1fr 1fr}',
              '.vn-pollutant{border-left:12px solid #d8dee9;background:#f8fafc;border-radius:8px;padding:14px 14px 12px;display:flex;flex-direction:column;min-width:0}',
              '.vn-pollutant-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px}',
              '.vn-param{font-size:24px;font-weight:900;color:#14213d}',
              '.vn-status{font-size:16px;font-weight:900;border-radius:6px;padding:9px 10px;text-align:center;line-height:1.05;max-width:220px}',
              '.vn-aqi-row{display:flex;align-items:center;justify-content:center;flex:1;min-height:92px}',
              '.vn-aqi{font-size:104px;font-weight:900;line-height:.95;letter-spacing:0}',
              '.vn-meter{height:16px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:2px}',
              '.vn-meter span{display:block;height:100%;border-radius:999px}',
              '.vn-desc{font-size:17px;font-weight:800;line-height:1.2;color:#334155;margin-top:10px;min-height:42px}',
              '.vn-asof{font-size:15px;font-weight:900;color:#64748b;margin-top:8px}',
              '.vn-legend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-height:48px}',
              '.vn-band{border-radius:6px;padding:10px 8px;text-align:center;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}',
              '.vn-footer{display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:900;color:#475569;min-height:28px}',
              '@media (max-aspect-ratio: 3/4){.vn-wall{padding:28px}.vn-header{min-height:86px}.vn-logo{width:72px;height:72px}.vn-title{font-size:40px}.vn-clock{font-size:20px;min-width:210px}.vn-grid{gap:14px}.vn-card{padding:14px}.vn-card-title{font-size:25px}.vn-address{font-size:16px}.vn-param{font-size:20px}.vn-status{font-size:14px}.vn-aqi{font-size:82px}.vn-desc{font-size:15px}}',
            '</style>',
            '<div class="vn-wall">',
              '<div class="vn-header">',
                '<div class="vn-brand">',
                  '<img class="vn-logo" src="/air-quality-monitoring/emblogo.svg" alt="EMB R3">',
                  '<div>',
                    '<div class="vn-kicker">EMB Region III</div>',
                    '<div class="vn-title">Air Quality Index</div>',
                  '</div>',
                '</div>',
                '<div class="vn-clock">', escapeHtml(fmtDate(now)), '</div>',
              '</div>',
              '<div class="vn-grid">',
                stationCardHtml(stations[0]),
                stationCardHtml(stations[1]),
                stationCardHtml(stations[2]),
                stationCardHtml(stations[3]),
              '</div>',
              '<div class="vn-legend">',
                legendHtml(),
              '</div>',
              '<div class="vn-footer">',
                '<span>Real-time Particulate Matter Monitor</span>',
                '<span>Data refreshes every 60 seconds</span>',
              '</div>',
            '</div>'
          ].join("");
        }

        function stationCardHtml(station) {
          var bodyClass = station.pollutants.length > 1 ? "vn-card-body dual" : "vn-card-body";
          var html = '<div class="vn-card"><div class="vn-card-title">' + escapeHtml(station.name) + '</div><div class="vn-address">' + escapeHtml(station.address) + '</div><div class="' + bodyClass + '">';
          var i;
          for (i = 0; i < station.pollutants.length; i += 1) {
            html += pollutantHtml(station.pollutants[i]);
          }
          html += "</div></div>";
          return html;
        }

        function legendHtml() {
          var html = "";
          var i;
          for (i = 0; i < bands.length; i += 1) {
            html += '<div class="vn-band" style="background:' + bands[i].color + ';color:' + bands[i].fg + '">' + escapeHtml(bands[i].short) + '</div>';
          }
          return html;
        }

        function refresh() {
          loadJsonpBundle(function (ok) {
            if (ok) {
              render();
              return;
            }
            refreshWithXhr();
          });
        }

        function refreshWithXhr() {
          var pending = 0;
          var stationIndex;
          var pollutantIndex;
          function doneFor(key) {
            return function (err, json) {
              if (!err && json) state[key] = json;
              pending -= 1;
              if (pending <= 0) render();
            };
          }
          for (stationIndex = 0; stationIndex < stations.length; stationIndex += 1) {
            for (pollutantIndex = 0; pollutantIndex < stations[stationIndex].pollutants.length; pollutantIndex += 1) {
              var item = stations[stationIndex].pollutants[pollutantIndex];
              var key = item.province + ":" + item.pollutant;
              pending += 1;
              loadLatest(item, doneFor(key));
            }
          }
          if (!pending) render();
        }

        function startFallback() {
          var rootText = root.textContent || "";
          var canReplaceRoot =
            root.childElementCount === 0 ||
            root.getAttribute("data-vnnox-fallback") ||
            rootText.indexOf("Unable to load the live display") !== -1;
          if (!canReplaceRoot) return;
          root.setAttribute("data-vnnox-fallback", "true");
          render();
          refresh();
          setInterval(refresh, 30000);
          setInterval(render, 60000);
        }

        setTimeout(startFallback, 1500);
      })();
    </script>
  </body>
</html>
